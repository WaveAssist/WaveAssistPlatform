[project]
name = "waveassist-mcp"
version = "0.1.0"
description = "WaveAssist MCP server — build & deploy deterministic recurring agents from Claude Code or Cursor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.scripts]
waveassist-mcp = "waveassist_mcp.server:main"            # stdio (local: Claude Code / Cursor)
waveassist-mcp-http = "waveassist_mcp.server:serve_http"  # streamable-HTTP (hosted at mcp.waveassist.io)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waveassist_mcp"]

[tool.pytest.ini_options]
# Only collect the real unit tests; scripts/ holds live drivers that read env at
# import time and must NOT be collected (a bare `pytest` would otherwise error).
testpaths = ["tests"]
norecursedirs = ["scripts", ".venv"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]
