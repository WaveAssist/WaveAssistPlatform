<!doctype html>
<html lang="en" data-brand="%VITE_BRAND%">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Google Tag Manager — loaded only when telemetry is enabled for this build.
         %VITE_TELEMETRY% is replaced by Vite at build time; "off" (self-hosted default)
         skips GTM entirely so a private box never beacons to Google. -->
    <script>
    if ("%VITE_TELEMETRY%".toLowerCase() !== "off") {
      (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
      new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
      'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer','GTM-NTQNGDRS');
    }
    </script>
    <!-- End Google Tag Manager -->
    
    <link rel="icon"  href="/src/assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"
/>
    <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-dark.min.css"
/>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>WaveAssistDashboard</title>
  </head>
  <body>
    <!-- The GTM <noscript> iframe was removed: it cannot be gated by the telemetry
         flag (no JS), so it would beacon to Google even on a telemetry-off build.
         The SPA requires JavaScript anyway. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
