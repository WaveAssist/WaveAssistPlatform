name: Docker Image CI

on:
  push:
    branches: [ "deploy" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Amazon ECR
      env:
        AWS_REGION: us-east-1
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin 713358430452.dkr.ecr.us-east-1.amazonaws.com

    - name: Build the Local Docker image
      env:
        VITE_DASHBOARD_BASE_URL: http://localhost:8000/
      run: docker build --platform linux/amd64 . --file Dockerfile --tag waveassist_dashboard:local

    - name: Tag the Local Docker image
      run: docker tag waveassist_dashboard:local 713358430452.dkr.ecr.us-east-1.amazonaws.com/waveassist_dashboard:local

    - name: Push the Local Docker image to ECR
      run: docker push 713358430452.dkr.ecr.us-east-1.amazonaws.com/waveassist_dashboard:local

    - name: Build the Cloud Docker image
      env:
        VITE_DASHBOARD_BASE_URL: https://api.waveassist.io/
      run: docker build --platform linux/amd64 . --file Dockerfile --tag waveassist_dashboard:cloud

    - name: Tag the Cloud Docker image
      run: docker tag waveassist_dashboard:cloud 713358430452.dkr.ecr.us-east-1.amazonaws.com/waveassist_dashboard:cloud

    - name: Push the Cloud Docker image to ECR
      run: docker push 713358430452.dkr.ecr.us-east-1.amazonaws.com/waveassist_dashboard:cloud
